<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的视频库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .title {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: translateY(-3px);
        }
        .video-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #ddd;
        }
        .video-info {
            padding: 12px;
        }
        .video-name {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        /* 播放弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-video {
            width: 90%;
            max-width: 800px;
            outline: none;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title">我的视频合集</h1>
    <div class="video-list" id="videoList"></div>
</div>

<!-- 播放弹窗 -->
<div class="modal" id="modal">
    <span class="close" onclick="closeVideo()">×</span>
    <video class="modal-video" id="player" controls autoplay></video>
</div>

<script>
    // ==============================================
    // 在这里添加你的视频！！！
    // 格式：{name:"视频名字", url:"视频地址"}
    // ==============================================
    const videos = [
        { name: "洗手台贴纸安装教程", url: "https://sns-bak-v1.xhscdn.com/stream/79/110/258/01e9b9824c56383d4f0370019cfca6cc49_258.mp4" },
 { name: "冰箱旋转贴安装教程1", url: "https://sns-bak-v6.xhscdn.com/stream/79/110/258/01e9915fd62fe93d4f0370019c5fdf3b94_258.mp4" },
 { name: "冰箱旋转贴安装教程2", url: "https://sns-bak-v1.xhscdn.com/stream/1/110/258/01e98a0a00b7a154010370019c43379eae_258.mp4" },
 { name: "毛毡板复原教程", url: "https://sns-bak-v1.xhscdn.com/stream/79/110/258/01e98989421931df4f0370019c4141b45e_258.mp4" },
    ];

    // 渲染视频列表
    const list = document.getElementById("videoList");
    videos.forEach((v, i) => {
        const item = `
        <div class="video-card" onclick="playVideo('${v.url}')">
            <video class="video-cover" src="${v.url}" muted loop preload="metadata"></video>
            <div class="video-info">
                <div class="video-name">${v.name}</div>
            </div>
        </div>`;
        list.innerHTML += item;
    });

    // 播放
    function playVideo(url) {
        document.getElementById("modal").style.display = "flex";
        document.getElementById("player").src = url;
    }
    // 关闭
    function closeVideo() {
        document.getElementById("modal").style.display = "none";
        document.getElementById("player").pause();
    }
</script>
</body>
</html>
